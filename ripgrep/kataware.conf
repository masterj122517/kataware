# Kataware — color settings only; keep search behavior in your own config.
# Paths: blue. Positions: muted. Matches: bold gold, without a solid fill.
--colors=path:none
--colors=path:fg:0x6C,0xA8,0xFF
--colors=line:none
--colors=line:fg:0x6B,0x7F,0xA2
--colors=column:none
--colors=column:fg:0x6B,0x7F,0xA2
--colors=match:none
--colors=match:fg:0xF2,0xC3,0x8B
--colors=match:style:bold
