# Kataware — a comet-lit indigo night.
# Load after other tmux themes/plugins so these styles take precedence.

# Copy-mode selection matches Ghostty's native text selection.
set -g mode-style "none,fg=#EEF3FF,bg=#1D2A49"

# Quiet chrome; cyan text marks focus without a solid accent-colored tab.
set -g status-style "none,fg=#A8B7D0,bg=#10172A"
set -g window-status-style "none,fg=#6B7FA2,bg=#10172A"
set -g window-status-current-style "none,fg=#60D7E8,bg=#1D2A49,bold"

# Keep pane backgrounds untouched, including transparent terminals.
set -g pane-border-style "none,fg=#2B3B62,bg=default"
set -g pane-active-border-style "none,fg=#6B7FA2,bg=default"
