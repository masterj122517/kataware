# Kataware — a comet-lit indigo night.
# Load after other tmux themes/plugins so these styles take precedence.

# Copy-mode selection matches Ghostty's native text selection.
set -g mode-style "none,fg=#EEF3FF,bg=#2B3B62"

# Quiet chrome; the current window gets the comet accent.
set -g status-style "none,fg=#D9E2F2,bg=#151F38"
set -g window-status-style "none,fg=#A8B7D0,bg=#151F38"
set -g window-status-current-style "none,fg=#0B1020,bg=#60D7E8,bold"

# Keep pane backgrounds untouched, including transparent terminals.
set -g pane-border-style "none,fg=#2B3B62,bg=default"
set -g pane-active-border-style "none,fg=#60D7E8,bg=default"
